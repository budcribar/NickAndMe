# SonarCloud / SonarQube project settings for PageToMovie
# -------------------------------------------------------
# Primary analysis path is the GitHub Action (.github/workflows/sonarcloud.yml)
# which uses SonarScanner for .NET (begin / build / end). That scanner does not
# read this file the same way the CLI scanner does; the important flags are
# duplicated on the `dotnet sonarscanner begin` line for reliability.
#
# Keep this file in sync when you change exclusions or CPD thresholds so local
# runs (host/scripts/run-sonar-local.sh) and future self-hosted SonarQube
# instances stay consistent.
#
# Create the project once at https://sonarcloud.io :
#   Organization key : budcribar   (or your GitHub org/user)
#   Project key      : budcribar_PageToMovie
#   Project name     : PageToMovie
# Then generate a token and store it as the GitHub secret SONAR_TOKEN.

sonar.organization=budcribar
sonar.projectKey=budcribar_PageToMovie
sonar.projectName=PageToMovie
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Sources are discovered via the .NET solution; these are safety nets.
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/node_modules/**,\
  **/playwright/**,\
  **/*.min.js,\
  **/wwwroot/lib/**,\
  **/PageToMovie.Fakes/**/Generated/**

# Do not count test / load / tool code toward the main duplication metric.
sonar.cpd.exclusions=\
  **/PageToMovie.Tests/**,\
  **/PageToMovie.UiTests/**,\
  **/PageToMovie.LoadSim/**,\
  **/tools/**

# Slightly more sensitive CPD than Sonar defaults so residual small helpers
# (multiple StripFences, NormalizeBookText clones, etc.) surface after the
# earlier fix/dedupe-clones work. Raise again if noise becomes annoying.
sonar.cpd.cs.minimumTokens=50
sonar.cpd.cs.minimumLines=4

# Optional coverage (not required for duplication). When Coverlet is added to
# the test projects, point the scanner at the reports from the workflow.
# sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
# sonar.coverage.exclusions=**/PageToMovie.Tests/**,**/PageToMovie.UiTests/**,**/tools/**,**/*.razor
